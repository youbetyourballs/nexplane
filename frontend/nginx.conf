server {
    listen 80;

    # MCP endpoint — SSE (GET /api/mcp/sse) and JSON-RPC messages (POST /api/mcp/messages)
    location /api/mcp/ {
        proxy_pass         http://backend:8000/mcp/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Redirect bare /api/mcp to /api/mcp/ so SSE clients using the exact path still work
    location = /api/mcp {
        return 301 /api/mcp/;
    }

    # Proxy API calls to backend (strip /api prefix)
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Serve frontend SPA — fall back to index.html for client-side routing
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
    }
}
