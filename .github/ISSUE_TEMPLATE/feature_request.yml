name: Feature Request
description: Suggest a new connector, CR type, or platform capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. The most useful ones describe a real operational problem — what you're trying to do and why the platform doesn't support it today.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the operational context — what you're trying to change, automate, or protect, and what's missing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature — a new connector, CR type, API capability, UI improvement, etc.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New connector
        - New CR type / executor
        - Existing connector improvement
        - UI / UX
        - API
        - MCP / LLM integration
        - Rollback / safety
        - Audit / compliance
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you're using today, or other tools that handle this.
