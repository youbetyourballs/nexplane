name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Docker Compose (install.sh)
        - Docker Compose (manual)
        - AWS AMI
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Nexplane version
      placeholder: "e.g. v1.2.20 — found in Settings → About"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant backend or browser console output. This will be formatted as code automatically.
      render: shell
