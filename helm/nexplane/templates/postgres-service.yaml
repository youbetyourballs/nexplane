{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexplane.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "nexplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "nexplane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
